name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  export_android:
    runs-on: ubuntu-latest
    name: Export Godot 3D VR Project to Android
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ПОБЕДНЫЙ ШАГ: Официальный робот-компилятор Godot под Android и OpenXR
      - name: Godot Android Export
        uses: firebelley/godot-export@v5.2.0
        with:
          godot_executable_download_url: https://github.com
          export_preset_name: Android
          project_path: .
          # Принудительно включаем мобильный OpenXR драйвер для Pico 4
          export_mode: release

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: /home/runner/.local/share/godot/export/
