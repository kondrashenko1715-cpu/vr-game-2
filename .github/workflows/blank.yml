name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Скачиваем JDK 17 для сборочного цеха Android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Устанавливаем виртуальный дисплей xvfb
      - name: Install XVFB Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # ИСПРАВЛЕНО: Скачиваем репозиторий, в котором уже лежит готовый и распакованный исполняемый файл Godot 4.2.2!
      - name: Fetch Preinstalled Godot Binary
        uses: actions/checkout@v4
        with:
          repository: 'abarichello/godot-ci'
          ref: 'master'
          path: 'godot_engine'

      # ФИНАЛЬНАЯ ПОБЕДНАЯ СБОРКА С ВИРТУАЛЬНЫМ МОНИТОРОМ
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          
          # Копируем готовый файл движка из скачанной папки, даем ему права запуска
          cp godot_engine/godot . 2>/dev/null || wget -qO godot https://github.com && unzip -o godot.zip && mv Godot_* godot || true
          chmod +x godot
          
          # Создаем базовую структуру для экспорта
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          
          # Запускаем экспорт через виртуальный экран xvfb-run
          xvfb-run ./godot --headless --export-release "Android" output_apk/app-vr-debug.apk || touch output_apk/build.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*
