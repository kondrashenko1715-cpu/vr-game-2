name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Устанавливаем легкие инструменты компиляции Linux и виртуальный дисплей xvfb
      - name: Install Build Dependencies & XVFB
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxinerama-dev xvfb

      # ИСПРАВЛЕНО: Вместо скачивания битых архивов разворачиваем компилятор из исходников за секунды!
      - name: Compile Lightweight Godot Engine
        run: |
          git clone --depth 1 --branch 4.2.2-stable https://github.com godot_source
          cd godot_source
          scons platform=linuxbsd target=template_release dev_mode=no minizip=yes -j$(nproc)
          mv bin/godot.linuxbsd.template_release.x86_64 ../godot
          cd ..
          chmod +x godot
          
          # Создаем базовую системную структуру для экспорта без необходимости скачивания .tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable

      # ФИНАЛЬНАЯ ПОБЕДНАЯ СБОРКА НАШЕГО ОРАНЖЕВОГО 3D VR-КУБА С ВИРТУАЛЬНЫМ МОНИТОРОМ
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          xvfb-run ./godot --export-release "Android" output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
