name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Устанавливаем виртуальный дисплей xvfb
      - name: Install XVFB Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # Скачиваем оригинальный движок Godot 4.2.2 и шаблоны через проверенное облачное действие
      - name: Download Godot 4 Engine and Templates
        run: |
          # Скачиваем и распаковываем чистый движок
          curl -L -o godot.zip https://tuxfamily.org
          jar -xf godot.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot
          
          # Скачиваем и распаковываем шаблоны строго под версию 4.2.2.stable
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          curl -L -o templates.zip https://tuxfamily.org
          jar -xf templates.zip
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # ФИНАЛЬНАЯ ПОБЕДНАЯ СБОРКА С ВИРТУАЛЬНЫМ ЭКРАНОМ
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          
          # Запускаем современный Godot 4 через виртуальный дисплей xvfb!
          xvfb-run ./godot --export-release "Android" output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
