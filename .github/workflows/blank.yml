name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Устанавливаем виртуальный графический экран
      - name: Install XVFB Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # Подтягиваем распакованный движок из облачного контейнера
      - name: Fetch Preinstalled Godot Binary
        uses: actions/checkout@v4
        with:
          repository: 'abarichello/godot-ci'
          ref: 'master'
          path: 'godot_engine'

      # ЗАПУСКАЕМ ТЕСТОВЫЙ ЭКСПОРТ И ПРИНУДИТЕЛЬНО ЗАПИСЫВАЕМ ВСЕ ОШИБКИ В ФАЙЛ
      - name: Export VR APK and Capture Logs
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          
          # Настраиваем исполняемый файл
          cp godot_engine/godot .
          chmod +x godot
          
          # Подтягиваем мобильные шаблоны OpenXR
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          curl -L -o templates.zip https://github.com
          python3 -c "import zipfile; zipfile.ZipFile('templates.zip').extractall('t_out')"
          mv t_out/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/ 2>/dev/null || true
          
          # Запускаем сборку и сохраняем текстовый отчет (лог) в папку output_apk
          xvfb-run ./godot --headless --export-release "Android" output_apk/app-vr-debug.apk > output_apk/error_log.txt 2>&1 || true

      # Отдаем текстовый отчет об ошибке в виде архива для чтения
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/
