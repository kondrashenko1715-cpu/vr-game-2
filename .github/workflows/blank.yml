name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # УСТАНАВЛИВАЕМ МОЩНЫЙ 7-ZIP НА СЕРВЕР ЗА ПАРУ СЕКУНД
      - name: Install 7-Zip Extra Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download Godot Engine
        run: |
          # Скачиваем официальный движок Godot
          wget https://github.com
          
          # ИСПРАВЛЕНО: Заменили капризный unzip на мощную команду 7z!
          7z x Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot
          
          # Скачиваем и распаковываем мобильные шаблоны OpenXR
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          wget https://github.com
          
          # С помощью 7z распаковываем фирменный файл .tpz напрямую без переименований!
          7z x Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # ФИНАЛЬНАЯ СБОРКА НАШЕГО ОРАНЖЕВОГО 3D VR-КУБА
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          ./godot --headless --export-release "Android" output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
