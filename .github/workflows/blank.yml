name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ФИНАЛЬНАЯ ПОБЕДНАЯ СБОРКА: Жестко монтируем файл настроек прямо в системный корень Docker-контейнера!
      - name: Export VR APK via Connected Container
        run: |
          mkdir -p output_apk
          
          # 1. Генерируем официальный отладочный ключ Android в корне проекта
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          
          # 2. Вручную генерируем идеальный файл настроек прямо на месте с гарантированными путями
          echo '[settings]' > local_settings.tres
          echo 'export/android/android_sdk_path = "/android-sdk"' >> local_settings.tres
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/temurin-17-jdk-amd64"' >> local_settings.tres
          echo 'export/android/debug_keystore = "/project/debug.keystore"' >> local_settings.tres
          echo 'export/android/debug_username = "androiddebugkey"' >> local_settings.tres
          echo 'export/android/debug_password = "android"' >> local_settings.tres
          echo 'export/android/shutdown_adb_on_exit = true' >> local_settings.tres
          
          # 3. ЗАПУСКАЕМ DOCKER: Напрямую подменяем системный файл конфигурации /root/.config/godot/editor_settings-4.tres файлом из корня проекта!
          docker run \
            -e ANDROID_HOME=/android-sdk \
            -e JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64 \
            -v /usr/local/lib/android/sdk:/android-sdk \
            -v /usr/lib/jvm/temurin-17-jdk-amd64:/usr/lib/jvm/temurin-17-jdk-amd64 \
            -v $(pwd)/local_settings.tres:/root/.config/godot/editor_settings-4.tres \
            -v $(pwd):/project -w /project \
            barichello/godot-ci:4.2.2 godot --headless --export-debug "Android" output_apk/app-vr-debug.apk

      # Отдаем скомпилированный APK-файл игры с реальным весом в мегабайтах!
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
