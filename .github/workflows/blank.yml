name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ИСПРАВЛЕНО: Убрали хрупкое монтирование файлов конфигурации и передаем все параметры напрямую через системные переменные!
      - name: Export VR APK via Connected Container
        run: |
          mkdir -p output_apk
          
          # 1. Генерируем официальный отладочный цифровой ключ Android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          
          # 2. ЗАПУСКАЕМ DOCKER: Передаем переменные для сборщика Android Gradle напрямую через флаги -e
          docker run \
            -e ANDROID_HOME=/android-sdk \
            -e JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64 \
            -e GODOT_ANDROID_SDK_PATH=/android-sdk \
            -e GODOT_ANDROID_JAVA_SDK_PATH=/usr/lib/jvm/temurin-17-jdk-amd64 \
            -v /usr/local/lib/android/sdk:/android-sdk \
            -v /usr/lib/jvm/temurin-17-jdk-amd64:/usr/lib/jvm/temurin-17-jdk-amd64 \
            -v $(pwd):/project -w /project \
            barichello/godot-ci:4.2.2 godot --headless --android-sdk /android-sdk --export-debug "Android" output_apk/app-vr-debug.apk

      # Отдаем скомпилированный APK-файл игры с реальным весом в мегабайтах!
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
