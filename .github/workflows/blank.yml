name: Build Python Autonomous APK
on: [push, workflow_dispatch]

# Защита памяти: жестко фиксируем один поток для всего сервера сразу
env:
  P4A_NUM_WORKERS: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # ВШИВАЕМ GRADLE: Устанавливаем официальный рабочий инструмент сборки от Google!
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 python-for-android==2024.1.21

      - name: Build Finished APK
        run: |
          export ANDROID_ACCEPT_SDK_LICENSE="y"
          export JAVA_HOME=$JAVA_HOME_11_X64
          export PATH=$JAVA_HOME/bin:$PATH
          
          echo "============================================="
          echo "🚀 РОБОТ ЛЕОН ЗАПУСТИЛ УМНУЮ СБОРКУ ДЛЯ PICO 4!"
          echo "============================================="
          
          # Наш красивый фильтр логов по вашему гениальному предложению — пишет по одному слову для каждого шага
          buildozer android debug 2>&1 | tee build_full.log | grep --line-buffered -E "Building|Compiling target|Package|Applying patch|# |Installing|ERROR|Exception|failed" | sed -u -E '
            s/.*Building ([a-zA-Z0-9_#-]+).*/🔨 Собираем: \1.../
            s/.*Compiling target ([a-zA-Z0-9_#-]+).*/⚙️ Компилируем: \1.../
            s/.*Applying patch.*/🩹 Накладываем патч.../
            s/.*Installing ([a-zA-Z0-9_#-]+).*/📦 Ставим модуль: \1.../
            s/.*Package.*/🎁 Упаковка приложения.../
          '
          
          BUILDOZER_STATUS=${PIPESTATUS}
          
          # Ловушка ошибок: если финал упадет, выводим хвостик полного лога
          if [ $BUILDOZER_STATUS -ne 0 ]; then
            echo "============================================="
            echo "❌ ТОЧНАЯ ОШИБКА СБОРКИ НА ФИНАЛЬНОМ ШАГЕ:"
            echo "============================================="
            tail -n 100 build_full.log
            exit 1
          fi
          
          echo "============================================="
          echo "📦 УСПЕХ! ИГРА СОБРАНА! КОПИРУЕМ APK..."
          echo "============================================="
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/app-debug.apk \;

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: output_apk/app-debug.apk
