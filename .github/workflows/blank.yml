name: Build Python Autonomous APK
on: [push, workflow_dispatch]

env:
  P4A_NUM_WORKERS: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      # Устанавливаем стабильную Java 11 для упаковщика
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # Устанавливаем системные пакеты
      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build Finished APK
        run: |
          export ANDROID_ACCEPT_SDK_LICENSE="y"
          export JAVA_HOME=$JAVA_HOME_11_X64
          export PATH=$JAVA_HOME/bin:$PATH
          
          echo "============================================="
          echo "🚀 УНИЧТОЖАЕМ СЛЕДЫ PYTHON 3.14 НА СЕРВЕРЕ..."
          echo "============================================="
          
          # ЖЕСТКОЕ ИСПРАВЛЕНИЕ: принудительно перенаправляем глобальный вызов python3 строго на 3.11
          alias python3=python3.11
          alias python=python3.11
          
          if ! buildozer android debug > build.log 2>&1; then
            echo "============================================="
            echo "❌ ТОЧНАЯ ОШИБКА СБОРКИ НА ФИНАЛЬНОМ ШАГЕ:"
            echo "============================================="
            tail -n 150 build.log
            exit 1
          fi
          
          echo "============================================="
          echo "📦 УСПЕХ! ИГРА СОБРАНА! КОПИРУЕМ APK..."
          echo "============================================="
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/app-debug.apk \;

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: output_apk/app-debug.apk
