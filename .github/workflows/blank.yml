name: Build Python Autonomous APK
on: [push, workflow_dispatch]

env:
  P4A_NUM_WORKERS: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. СТАРАЯ НАДЁЖНАЯ НАСТРОЙКА PYTHON И JAVA
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 2. ГИБРИДНАЯ УСТАНОВКА СТАБИЛЬНЫХ СБОРЩИКОВ
      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip install --upgrade pip
          # Жестко фиксируем версию buildozer, которая не умеет качать Python 3.14
          pip install buildozer==1.5.0 cython==0.29.36

      # 3. НАДЁЖНЫЙ ФИНАЛЬНЫЙ ЗАПУСК С ОЧИСТКОЙ
      - name: Build Finished APK
        run: |
          rm -rf ~/.buildozer
          rm -rf ~/.cache/pip
          rm -rf .buildozer
          
          export ANDROID_ACCEPT_SDK_LICENSE="y"
          export JAVA_HOME=$JAVA_HOME_11_X64
          export PATH=$JAVA_HOME/bin:$PATH
          
          echo "============================================="
          echo "🚀 ГИБРИДНЫЙ РОБОТ ЗАПУСТИЛ СБОРКУ НА PYTHON 3.11..."
          echo "============================================="
          
          buildozer android debug

          echo "============================================="
          echo "📦 УСПЕХ! ИГРА СОБРАНА! КОПИРУЕМ APK..."
          echo "============================================="
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/app-debug.apk \;

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: output_apk/app-debug.apk
