name: Build Python Autonomous APK
on: [push, workflow_dispatch]

env:
  P4A_NUM_WORKERS: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 python-for-android==2024.1.21

      - name: Build Finished APK
        run: |
          export ANDROID_ACCEPT_SDK_LICENSE="y"
          export JAVA_HOME=$JAVA_HOME_11_X64
          export PATH=$JAVA_HOME/bin:$PATH
          
          for i in {1..5}; do
            echo "============================================="
            echo "🤖 ПОПЫТКА ИСПРАВЛЕНИЯ PYTHON №$i ИЗ 5..."
            echo "============================================="
            
            buildozer android debug > build.log 2>&1
            STATUS=$?
            
            if grep -q "3.14.2" build.log || grep -q "cp314" build.log; then
              echo "⚠️ ОБНАРУЖЕН УПРЯМЫЙ PYTHON 3.14! СТИРАЕМ И ПЕРЕНАСТРАИВАЕМ..."
              buildozer android clean
              rm -rf ~/.bcode ~/.buildozer/android/platform/build-arm64-v8a/dists/
              
              if [ $i -eq 5 ]; then
                echo "❌ ИТОГ: Робот 5 раз подряд попытался поставить 3.14. Проблема 100% в паспорте игры!"
                tail -n 100 build.log
                exit 1
              fi
              continue
            fi
            
            if [ $STATUS -ne 0 ]; then
              echo "❌ СБОЙ СБОРКИ НА ДРУГОМ ШАГЕ:"
              tail -n 150 build.log
              exit 1
            fi
            
            break
          done
          
          echo "============================================="
          echo "📦 УСПЕХ! ИГРА СОБРАНА! КОПИРУЕМ APK..."
          echo "============================================="
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/app-debug.apk \;

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: output_apk/app-debug.apk
