name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Устанавливаем движок и виртуальный графический экран xvfb
      - name: Install Official Godot and XVFB via APT
        run: |
          sudo apt-get update
          sudo apt-get install -y godot3-runner godot3 xvfb
          
          # Настраиваем папки для шаблонов
          mkdir -p ~/.local/share/godot/templates/3.5.2.stable

      # ФИНАЛЬНАЯ СБОРКА НАШЕГО ОРАНЖЕВОГО VR-КУБА С ВИРТУАЛЬНЫМ МОНИТОРОМ
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          
          # ИСПРАВЛЕНО: Запускаем экспорт через виртуальный дисплей xvfb-run, чтобы убрать ошибку X11!
          xvfb-run godot3 --export "Android" output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
