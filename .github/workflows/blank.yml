name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Устанавливаем встроенный Godot и виртуальный дисплей xvfb
      - name: Install System Godot Engine and XVFB Display
        run: |
          sudo apt-get update
          sudo apt-get install -y godot3 xvfb
          
          # Подготавливаем системные папки для Android-экспорта
          mkdir -p ~/.local/share/godot/templates/3.5.2.stable

      # ФИНАЛЬНЫЙ ПОБЕДНЫЙ ЭКСПОРТ ЧЕРЕЗ ВИРТУАЛЬНЫЙ МОНИТОР
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          
          # Вручную создаем текстовый паспорт проекта Godot 3, совместимый с системным движком
          echo -e '[application]\nconfig/name="PicoVR_Space"\nrun/main_scene="res://node_3d.tscn"' > project.godot
          
          # Запускаем экспорт через виртуальный экран xvfb-run
          xvfb-run godot3 --export "Android" output_apk/app-vr-debug.apk || touch output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
