name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Устанавливаем JDK 17 для стабильной работы Gradle-сборщика
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ПОБЕДНЫЙ ШАГ: Официальный, стабильный и поддерживаемый сборщик Godot 4 под Android
      - name: Godot Android Export
        uses: simon-floss/godot-export-action@v1
        with:
          godot-version: '4.2.2'
          export-preset: 'Android'
          project-path: '.'

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: '**/*.apk'
