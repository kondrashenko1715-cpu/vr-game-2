name: Build Python Autonomous APK
on: [push, workflow_dispatch]

env:
  P4A_NUM_WORKERS: 1
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # Ставим утилиту dos2unix для тотальной очистки файлов
      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev dos2unix
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 python-for-android==2024.1.21

      - name: Build Finished APK
        run: |
          export ANDROID_ACCEPT_SDK_LICENSE="y"
          export JAVA_HOME=$JAVA_HOME_11_X64
          export PATH=$JAVA_HOME/bin:$PATH
          
          echo "============================================="
          echo "🚀 ВЫЖИГАЕМ СБОЙНЫЙ БАЙТ 0xF6 ИЗ ВСЕХ ФАЙЛОВ..."
          echo "============================================="
          
          # Насильно очищаем main.py от виндовс-кодировок и скрытых символов
          dos2unix main.py buildozer.spec || true
          
          # Заменяем возможные скрытые байты 0xf6 на безопасные символы пустоты
          sed -i 's/\xf6//g' main.py || true
          
          echo "============================================="
          echo "🚀 РОБОТ ЛЕОН ЗАПУСТИЛ ФИНАЛЬНУЮ СБОРКУ ДЛЯ PICO 4!"
          echo "============================================="
          
          set +e
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONIOENCODING=utf-8
          buildozer android debug > build_raw.log 2>&1
          BUILDOZER_STATUS=$?
          set -e
          
          if [ $BUILDOZER_STATUS -ne 0 ]; then
            echo "============================================="
            echo "❌ ТОЧНАЯ ОШИБКА СБОРКИ НА ФИНАЛЬНОМ ШАГЕ:"
            echo "============================================="
            grep -E "ERR|Exception|failed|Error:" build_raw.log | tail -n 100
            exit 1
          fi
          
          echo "============================================="
          echo "📦 УСПЕХ! ИГРА СОБРАНА! КОПИРУЕМ APK..."
          echo "============================================="
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/app-debug.apk \;

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: output_apk/app-debug.apk
