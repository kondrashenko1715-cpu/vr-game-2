name: Build Python Autonomous APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build Finished APK
        run: |
          # ИСПРАВЛЕНО: Принудительно создаем старый путь папки, который ищет Buildozer
          mkdir -p /usr/local/lib/android/sdk/tools/bin
          
          # Создаем виртуальный мост (ссылку) к реальному sdkmanager на сервере GitHub
          if [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
          fi
          
          # Заранее создаем папки под лицензии Google
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # Бесшумно подписываем системные лицензии GitHub
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          
          # Копируем их в рабочую область Buildozer
          cp -r /usr/local/lib/android/sdk/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true
          
          # Запускаем сборку
          buildozer android debug
          
          mkdir -p output_apk
          cp bin/*.apk output_apk/app-debug.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: output_apk/app-debug.apk
