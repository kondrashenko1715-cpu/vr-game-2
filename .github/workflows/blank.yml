name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ФИНАЛЬНАЯ СБОРКА: Копируем шаблоны в системный корень /root/ и собираем через флаг отладки!
      - name: Export VR APK
        run: |
          mkdir -p output_apk
          
          # Создаем точную папку шаблонов в корне суперпользователя контейнера /root/
          mkdir -p /root/.local/share/godot/export_templates/4.2.2.stable
          
          # Скачиваем и распаковываем официальные мобильные шаблоны OpenXR прямо туда через стабильный Python
          curl -L -o templates.zip https://github.com
          python3 -c "import zipfile; zipfile.ZipFile('templates.zip').extractall('t_out')"
          mv t_out/templates/* /root/.local/share/godot/export_templates/4.2.2.stable/
          
          # ЗАПУСКАЕМ СБОРКУ ЧЕРЕЗ ФЛАГ DEBUG, КОТОРЫЙ ИГНОРИРУЕТ ПУТИ JAVA SDK!
          godot --headless --export-debug "Android" output_apk/app-vr-debug.apk

      # Отдаем скомпилированный APK-файл игры с реальным весом в мегабайтах
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
