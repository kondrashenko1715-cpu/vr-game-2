name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  export_android:
    runs-on: ubuntu-latest
    name: Export Godot 3D VR Project to Android
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ИСПРАВЛЕНО: Обновили версию компилятора и исправили имена всех параметров под стандарты GitHub!
      - name: Godot Android Export
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_version: '4.2.2'
          export_preset: 'Android'
          project_dir: '.'
          is_release: false

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: .godot/export/
