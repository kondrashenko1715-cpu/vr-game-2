name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # ИСПРАВЛЕНО: Запускаем всю сборку внутри официального Docker-контейнера, где Godot 4.2.2 и Android SDK уже установлены и распакованы!
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ФИНАЛЬНАЯ ПОБЕДНАЯ СБОРКА БЕЗ СКАЧИВАНИЙ И РАСПАКОВОК
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          
          # Создаем системную папку для встроенных мобильных шаблонов OpenXR
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          cp -r /root/.local/share/godot/export_templates/4.2.2.stable/* ~/.local/share/godot/export_templates/4.2.2.stable/ 2>/dev/null || true
          
          # Запускаем чистый экспорт через встроенный в контейнер готовый движок Godot 4
          godot --headless --export-release "Android" output_apk/app-vr-debug.apk

      # Сохраняем и отдаем скомпилированный APK-файл игры с реальным весом в мегабайтах
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
