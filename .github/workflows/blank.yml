name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # РОБОТ САМ СКАЧИВАЕТ ОФИЦИАЛЬНЫЙ ДВИЖОК БЕЗ ПОСРЕДНИКОВ
      - name: Download Godot Engine
        run: |
          wget https://github.com
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot
          
          # Скачиваем официальные мобильные шаблоны экспорта
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          wget https://github.com
          unzip Godot_v4.2.2-stable_export_templates.tpz -d templates_extract
          mv templates_extract/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # ФИНАЛЬНАЯ ПРЯМАЯ СБОРКА НАШЕГО ОРАНЖЕВОГО 3D VR-КУБА!
      - name: Export VR APK
        run: |
          mkdir -p output_apk
          ./godot --headless --export-release "Android" output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
