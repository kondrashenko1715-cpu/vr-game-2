name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ФИНАЛЬНАЯ ПОБЕДНАЯ СБОРКА: Подкладываем созданный нами файл настроек прямо в сердце Docker!
      - name: Export VR APK via Connected Container
        run: |
          mkdir -p output_apk
          
          # 1. Генерируем цифровой отладочный ключ Android в корне проекта
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          
          # 2. Создаем системную папку для конфигов, чтобы Docker её сразу увидел
          mkdir -p .godot_config
          cp editor_settings-4.tres .godot_config/
          
          # 3. ЗАПУСКАЕМ DOCKER: Монтируем наш созданный файл настроек прямо в системный корень /root/ контейнера!
          docker run \
            -e ANDROID_HOME=/android-sdk \
            -e JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64 \
            -v /usr/local/lib/android/sdk:/android-sdk \
            -v /usr/lib/jvm/temurin-17-jdk-amd64:/usr/lib/jvm/temurin-17-jdk-amd64 \
            -v $(pwd)/.godot_config:/root/.config/godot \
            -v $(pwd):/project -w /project \
            barichello/godot-ci:4.2.2 godot --headless --export-debug "Android" output_apk/app-vr-debug.apk

      # Отдаем скомпилированный APK-файл игры с реальным весом в мегабайтах!
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
