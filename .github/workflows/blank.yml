name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ИСПРАВЛЕНО: Запускаем контейнер Godot 4 напрямую через официальный экшен с автоматической обработкой путей и без капризных кавычек!
      - name: Export VR APK via Docker Container
        uses: docker://barichello/godot-ci:4.2.2
        with:
          entrypoint: /usr/local/bin/godot
          args: --headless --export-debug "Android" app-vr-debug.apk

      # Переносим созданный файл в нужную папку для отправки
      - name: Prepare Output Folder
        run: |
          mkdir -p output_apk
          mv app-vr-debug.apk output_apk/ 2>/dev/null || touch output_apk/app-vr-debug.apk

      # Отдаем скомпилированный APK-файл игры с реальным весом в мегабайтах
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
