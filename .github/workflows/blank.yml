name: Build Python Autonomous APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build Finished APK
        run: |
          rm -rf ~/.cache/pip
          rm -rf .buildozer
          
          export ANDROID_ACCEPT_SDK_LICENSE="y"
          
          # ИСПРАВЛЕНО: Прячем весь бесконечный спам логов компиляции в /dev/null,
          # но перенаправляем поток ОШИБОК (stderr) на экран, чтобы видеть только суть!
          buildozer android debug > /dev/null
          
          mkdir -p output_apk
          cp bin/*.apk output_apk/app-debug.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: output_apk/app-debug.apk
