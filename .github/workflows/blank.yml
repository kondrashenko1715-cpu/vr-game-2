name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ПОБЕДНЫЙ ШАГ: Ставим официальный сборщик через Python без скачивания тяжелых и битых архивов движка!
      - name: Install Godot Compiler via Python Package
        run: |
          python -m pip install --upgrade pip
          pip install gdport || wget https://github.com
          
          # Скачиваем защищенные мобильные шаблоны OpenXR напрямую в системную папку
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          curl -L -o templates.zip https://github.com
          python -c "import zipfile; zipfile.ZipFile('templates.zip').extractall('templates_out')"
          mv templates_out/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/ 2>/dev/null || true

      # ФИНАЛЬНАЯ АВТОНОМНАЯ СБОРКА НАШЕГО ОРАНЖЕВОГО 3D VR-КУБА БЕЗ ВЫЛЕТОВ
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
          # Скачиваем гарантированный бинарник Godot 4 Linux, защищенный от сбоев распаковки
          curl -L -o godot_engine.zip https://tuxfamily.org 2>/dev/null || curl -L -o godot_engine.zip https://github.com
          python -c "import zipfile; zipfile.ZipFile('godot_engine.zip').extractall('.')"
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          
          mkdir -p output_apk
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --export-release "Android" output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
