name: Build Python Autonomous APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Initialize and Configure Buildozer
        run: |
          buildozer init
          
          sed -i 's/^title =.*/title = PicoPythonGame/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = picopythongame/' buildozer.spec
          sed -i 's/^package.domain =.*/package.domain = com.vrgame.cube/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy,pyopengl/' buildozer.spec
          sed -i 's/^orientation =.*/orientation = landscape/' buildozer.spec
          
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build Finished APK
        run: |
          # ИСПРАВЛЕНО: Запускаем сборку и передаем встроенный флаг автоматического принятия лицензий Google
          buildozer android debug --accept-sdk-license
          mkdir -p output_apk
          cp bin/*.apk output_apk/app-debug.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: output_apk/app-debug.apk
