name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ФИНАЛЬНАЯ ПОБЕДНАЯ СБОРКА: Передаем точные системные пути Android SDK прямо внутрь настроек Godot!
      - name: Export VR APK
        run: |
          mkdir -p output_apk
          
          # Жестко прописываем пути для Android SDK внутри конфигурации Godot редактора
          mkdir -p ~/.config/godot
          echo '[settings]' > ~/.config/godot/editor_settings-4.tres
          echo 'export/android/android_sdk_path = "/usr/local/lib/android/sdk"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/shutdown_adb_on_exit = true' >> ~/.config/godot/editor_settings-4.tres
          
          # Запускаем экспорт через встроенный Godot 4 со всеми правами доступа
          godot --headless --export-release "Android" output_apk/app-vr-debug.apk

      # Отдаем скомпилированный APK-файл игры с реальным весом в мегабайтах
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
