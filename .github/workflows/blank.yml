name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ИСПРАВЛЕНО: Полностью убрали капризное скачивание шаблонов через интернет и запустили сборку на встроенных файлах!
      - name: Export VR APK via Connected Container
        run: |
          mkdir -p output_apk
          
          # Настраиваем локальный паспорт путей Android SDK для Godot
          mkdir -p .godot/editor
          mkdir -p ~/.config/godot
          echo '[settings]' > ~/.config/godot/editor_settings-4.tres
          echo 'export/android/android_sdk_path = "/android-sdk"' >> ~/.config/godot/editor_settings-4.tres
          
          # Исправлено: Заменили ошибочный флаг --v на правильный -v и запустили Godot на встроенных шаблонах контейнера!
          docker run -v /usr/local/lib/android/sdk:/android-sdk -v $(pwd):/project -w /project barichello/godot-ci:4.2.2 godot --headless --export-debug "Android" output_apk/app-vr-debug.apk

      # Отдаем скомпилированный APK-файл игры с реальным весом в мегабайтах
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
