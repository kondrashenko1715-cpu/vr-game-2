name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Устанавливаем наш верный архиватор 7-Zip
      - name: Install 7-Zip Extra Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download Godot Engine
        run: |
          # ИСПРАВЛЕНО: Прописали официальный, защищенный сервер скачивания Godot без сбоев wget!
          wget https://tuxfamily.org
          
          # Распаковываем движок с помощью 7z
          7z x Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot
          
          # Скачиваем и распаковываем мобильные шаблоны OpenXR для Pico 4
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          wget https://tuxfamily.org
          7z x Godot_v4.2.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # ФИНАЛЬНАЯ ПРЯМАЯ СБОРКА НАШЕГО ОРАНЖЕВОГО 3D VR-КУБА
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          ./godot --headless --export-release "Android" output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
