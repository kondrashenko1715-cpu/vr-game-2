name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ПОБЕДНЫЙ ШАГ: Запускаем Docker-контейнер, где Godot 4 и Android SDK уже установлены и готовы к работе!
      - name: Export VR APK via Docker Container
        uses: docker://barichello/godot-ci:4.2.2
        with:
          args: |
            sh -c '
            mkdir -p output_apk
            
            # Принудительно заставляем движок использовать свои встроенные шаблоны
            godot --headless --export-debug "Android" output_apk/app-vr-debug.apk
            '

      # Отдаем скомпилированный APK-файл игры с реальным весом в мегабайтах
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
