name: Build Python Autonomous APK
on: [push, workflow_dispatch]

# Защита памяти: жестко фиксируем один поток для всего сервера сразу
env:
  P4A_NUM_WORKERS: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build Finished APK
        run: |
          export ANDROID_ACCEPT_SDK_LICENSE="y"
          
          # Жестко связываем системные команды с версией Python 3.11
          sudo ln -sf $(which python3.11) /usr/local/bin/python3
          sudo ln -sf $(which python3.11) /usr/bin/python3
          
          echo "============================================="
          echo "🚀 РОБОТ ЛЕОН ЗАПУСТИЛ СБОРКУ ИГРЫ ДЛЯ PICO 4!"
          echo "============================================="
          
          # ИСПРАВЛЕНО: Убрали цикл из 10 попыток. Запускаем один чистый процесс в файл лога build.log.
          if ! buildozer android debug > build.log 2>&1; then
            echo "============================================="
            echo "❌ ТОЧНАЯ ОШИБКА СБОРКИ НА ФИНАЛЬНОМ ШАГЕ:"
            echo "============================================="
            # Ловушка: если сборка упала, выводим только последние 150 строк с сутью ошибки
            tail -n 150 build.log
            exit 1
          fi
          
          echo "============================================="
          echo "📦 УСПЕХ! ИГРА СОБРАНА! КОПИРУЕМ APK..."
          echo "============================================="
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/app-debug.apk \;

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: output_apk/app-debug.apk
