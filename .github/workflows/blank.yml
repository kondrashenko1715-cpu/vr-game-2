name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ПОБЕДНЫЙ ШАГ: Официальный облачный компилятор Godot 4 с предустановленным Android SDK и OpenXR!
      - name: Godot Android Export
        uses: wathsara/godot-android-export@v1.1
        with:
          export-preset: 'Android'
          project-path: '.'

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: '**/*.apk'
