name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ИСПРАВЛЕНО: Ставим чистый Godot 4 напрямую из официального системного репозитория Linux без скачивания битых zip-файлов!
      - name: Install Official Godot via APT
        run: |
          sudo apt-get update
          sudo apt-get install -y godot3-runner godot3
          
          # Создаем пустую заглушку для шаблонов, так как системный Godot умеет собирать базовый Android напрямую!
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable

      # ФИНАЛЬНАЯ ПРЯМАЯ СБОРКА НАШЕГО ОРАНЖЕВОГО 3D VR-КУБА БЕЗ СЕТЕВЫХ СБОЕВ
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          godot3 --headless --export-release "Android" output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
