name: Build Python Autonomous APK
on: [push, workflow_dispatch]

env:
  P4A_NUM_WORKERS: 1
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-11-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev dos2unix locales
          pip install --upgrade pip
          # ИСПРАВЛЕНО: Убрали сбойную версию 2024.6.2. Ставим чистый рабочий инструментарий
          pip install buildozer cython python-for-android

      - name: Build Finished APK
        run: |
          export ANDROID_ACCEPT_SDK_LICENSE="y"
          export JAVA_HOME=$JAVA_HOME_11_X64
          export PATH=$JAVA_HOME/bin:$PATH
          
          sudo locale-gen en_US.UTF-8
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          
          dos2unix main.py buildozer.spec || true
          
          echo "============================================="
          echo "🚀 РОБОТ ЛЕОН ЗАПУСТИЛ СБОРКУ ИГРЫ..."
          echo "============================================="
          
          set +e
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONIOENCODING=utf-8
          
          # Запускаем сборку напрямую, чтобы видеть прогресс финала
          buildozer android debug
