name: Build Python Autonomous APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Initialize and Configure Buildozer
        run: |
          buildozer init
          
          sed -i 's/^title =.*/title = PicoPythonGame/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = picopythongame/' buildozer.spec
          sed -i 's/^package.domain =.*/package.domain = com.vrgame.cube/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy,pyopengl/' buildozer.spec
          sed -i 's/^orientation =.*/orientation = landscape/' buildozer.spec
          
          # Заранее создаем структуру папок, чтобы Buildozer не путался в путях Google
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          
          # Прописываем готовые лицензии
          echo -e "244d2d9e8dbc56f047e6863d613bc793828a74bc\n5c50c75a9f6285136d319b448d67252277d4c244\nc33c2e51ccc596ed5e7f8f1de05d4d292e8a202d" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build Finished APK
        run: |
          # ИСПРАВЛЕНО: Связываем новый sdkmanager со старым путем, который ищет Buildozer
          if [ -d "${ANDROID_HOME}/cmdline-tools/latest/bin" ]; then
            ln -s ${ANDROID_HOME}/cmdline-tools/latest/bin/* ~/.buildozer/android/platform/android-sdk/tools/bin/ || true
          fi
          
          # Запускаем финальную компиляцию
          buildozer android debug
          mkdir -p output_apk
          cp bin/*.apk output_apk/app-debug.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: output_apk/app-debug.apk
