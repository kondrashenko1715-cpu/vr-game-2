name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Устанавливаем виртуальный дисплей xvfb для графической подсистемы
      - name: Install XVFB Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # ФИНАЛЬНАЯ ИСПРАВЛЕННАЯ СБОРКА С ВИРТУАЛЬНЫМ ЭКРАНОМ И ГАРАНТИРОВАННЫМИ ССЫЛКАМИ
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          
          # Скачиваем оригинальный стабильный движок Godot 4.2.2 Linux через официальное зеркало
          curl -H "User-Agent: Mozilla/5.0" -L -o godot.zip https://tuxfamily.org
          python3 -c "import zipfile; zipfile.ZipFile('godot.zip').extractall('.')"
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot
          
          # Скачиваем и устанавливаем официальные мобильные шаблоны OpenXR для Pico 4
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          curl -H "User-Agent: Mozilla/5.0" -L -o templates.zip https://tuxfamily.org
          python3 -c "import zipfile; zipfile.ZipFile('templates.zip').extractall('t_out')"
          mv t_out/templates/* ~/.local/share/godot/export_templates/4.2.2.stable/
          
          # Запускаем сборку 3D-сцены через виртуальный монитор xvfb-run
          xvfb-run ./godot --headless --export-release "Android" output_apk/app-vr-debug.apk

      # Сохраняем и отдаем скомпилированный APK-файл игры
      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
