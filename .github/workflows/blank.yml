name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ИСПРАВЛЕНО: Ставим стабильный официальный Godot через системный snap без указания капризных каналов!
      - name: Install Godot via Snap
        run: |
          sudo snap install godot --classic
          
          # Скачиваем и распаковываем шаблоны через проверенный curl и стабильный unzip
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          curl -L -o templates.zip https://github.com
          unzip -o templates.zip
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # ФИНАЛЬНАЯ ПРЯМАЯ СБОРКА НАШЕГО ОРАНЖЕВОГО 3D VR-КУБА БЕЗ ВЫЛЕТОВ
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          /snap/bin/godot --headless --export-release "Android" output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
