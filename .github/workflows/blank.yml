name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ИСПРАВЛЕНО: Установили официальный Godot прямо из системного магазина приложений Linux без всяких скачиваний архивов!
      - name: Install Godot via Snap
        run: |
          sudo snap install godot --classic
          
          # Скачиваем мобильные шаблоны OpenXR в обход curl через защищенный wget с зеркала
          mkdir -p ~/.local/share/godot/export_templates/4.2.2.stable
          wget https://tuxfamily.org
          mv Godot_v4.2.2-stable_export_templates.tpz templates.zip
          jar -xf templates.zip
          mv templates/* ~/.local/share/godot/export_templates/4.2.2.stable/

      # ФИНАЛЬНАЯ ПРЯМАЯ СБОРКА НАШЕГО ОРАНЖЕВОГО 3D VR-КУБА
      - name: Export VR APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          mkdir -p output_apk
          /snap/bin/godot --headless --export-release "Android" output_apk/app-vr-debug.apk

      - name: Upload VR APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/*.apk
