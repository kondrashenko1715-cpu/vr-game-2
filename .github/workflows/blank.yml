name: Build Godot Autonomous VR APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Export VR APK and Show Logs
        run: |
          mkdir -p output_apk
          
          # Генерируем отладочный ключ подписи
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          
          # Запускаем сборку в контейнере
          docker run \
            -v /usr/local/lib/android/sdk:/android-sdk \
            -v /usr/lib/jvm/temurin-17-jdk-amd64:/java-sdk \
            -v $(pwd):/project -w /project \
            barichello/godot-ci:4.2.2 bash -c '
              mkdir -p /root/.config/godot
              printf "[gd_resource type=\"EditorSettings\" format=3]\n\n[resource]\nexport/android/android_sdk_path = \"/android-sdk\"\nexport/android/java_sdk_path = \"/java-sdk\"\n" > /root/.config/godot/editor_settings-4.tres
              
              # 1. Устанавливаем шаблон сборки Android
              mkdir -p android/build
              unzip -q /root/.local/share/godot/export_templates/4.2.2.stable/android_source.zip -d android/build
              echo "4.2.2.stable" > android/.build_version
              
              # 2. ИСПРАВЛЕНО: Сначала прогреваем и импортируем ресурсы проекта, чтобы убрать конфликт!
              godot --headless --import
              
              # 3. Теперь запускаем чистую сборку APK!
              godot --headless --verbose --export-debug "Android" output_apk/app-vr-debug.apk > output_apk/build_log.txt 2>&1
            ' || true
            
          echo "================ ОТЧЕТ О СБОРКЕ GODOT ================"
          tail -n 40 output_apk/build_log.txt || true
          echo "======================================================"

      - name: Upload VR APK and Log to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-space-vr-apk
          path: output_apk/
