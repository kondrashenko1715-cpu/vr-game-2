name: Build Python Autonomous APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ПОБЕДНЫЙ ШАГ: Запускаем готовый Docker-контейнер со всеми встроенными инструментами Android и Gradle.
      # Он сам настроит окружение системы и выдаст готовый APK в папку bin/ без вылетов!
      - name: Build Android APK with Buildozer
        uses: SubjacentLight/action-android-buildozer@v1
        with:
          buildozer_version: 'stable'
          command: 'buildozer android debug'

      # Забираем скомпилированный APK-файл из родной папки контейнера bin/
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: bin/*.apk
