name: Build Python Autonomous APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Запускаем официальный Docker-контейнер в стабильном режиме.
      # Он сам контролирует потребление оперативной памяти и не вызовет сбой Out of memory!
      - name: Build Android APK with Buildozer Action
        uses: ArtemSuda/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-vr-apk
          path: bin/*.apk
